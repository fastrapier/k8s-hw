# Шаблон секретных values для werf.
#
# Здесь нет ни одного секрета — только ссылки ref+vault://, которые
# scripts/02-vault-integration.sh раскрывает через `vals eval`. Результат
# пишется во временный файл (secret-values.rendered.yaml, в .gitignore) и
# уходит в `werf converge --values`. Файл удаляется по trap.
#
# Пути соответствуют секретам, которые заводит scripts/01-setup-vault.sh.
global:
  secrets:
    postgres:
      username: ref+vault://secret/postgres#/username
      password: ref+vault://secret/postgres#/password
      database: ref+vault://secret/postgres#/database
    backend:
      username: ref+vault://secret/backend#/username
      password: ref+vault://secret/backend#/password
