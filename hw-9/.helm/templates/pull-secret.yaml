{{/*
imagePullSecret для приватных образов в GHCR.

Содержимое приходит не из values репозитория, а от werf: converge вызывается с
--set-docker-config-json-value, и werf кладёт base64 текущего docker config в
.Values.global.werf.dockerconfigjson. Логин в реестр делает scripts/02-vault-integration.sh
токеном из Vault, так что в git не попадает ни токен, ни dockerconfigjson.

dig, а не .Values.global.werf.dockerconfigjson: без флага ключа werf нет вовсе.
*/}}
{{- with dig "werf" "dockerconfigjson" "" .Values.global }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.global.imagePullSecret }}
  labels:
    app.kubernetes.io/part-of: hw9
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ . }}
{{- end }}
