{{- if .Values.migrations.enabled }}
{{/*
Job миграций — helm-хук post-install/post-upgrade: werf сначала дожидается
готовности StatefulSet Postgres, и только потом запускает миграции.
before-hook-creation удаляет прошлый Job, иначе новый тег образа упёрся бы
в immutable-поля Job.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "backend.fullname" . }}-migrations
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "backend.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      containers:
        - name: migrate
          image: {{ include "backend.image" (list . "migrations") | quote }}
          env:
            {{- include "backend.postgresEnv" . | nindent 12 }}
{{- end }}
