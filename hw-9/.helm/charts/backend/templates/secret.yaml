{{/*
Значения приезжают из Vault через --values (см. scripts/02-vault-integration.sh).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.backend.secretName }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET_USERNAME: {{ required "global.secrets.backend.username не задан: запустите scripts/02-vault-integration.sh" .Values.global.secrets.backend.username | quote }}
  APP_SECRET_PASSWORD: {{ required "global.secrets.backend.password не задан: запустите scripts/02-vault-integration.sh" .Values.global.secrets.backend.password | quote }}
