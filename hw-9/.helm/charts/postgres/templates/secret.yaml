{{/*
Значения приезжают из Vault через --values (см. scripts/02-vault-integration.sh).
В values.yaml они пустые: required не даст задеплоить чарт без секретов.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.postgres.secretName }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "global.secrets.postgres.username не задан: запустите scripts/02-vault-integration.sh" .Values.global.secrets.postgres.username | quote }}
  password: {{ required "global.secrets.postgres.password не задан: запустите scripts/02-vault-integration.sh" .Values.global.secrets.postgres.password | quote }}
  database: {{ required "global.secrets.postgres.database не задан: запустите scripts/02-vault-integration.sh" .Values.global.secrets.postgres.database | quote }}
