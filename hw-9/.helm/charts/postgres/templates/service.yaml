{{/* Headless — стабильные DNS-имена Pod-ов StatefulSet, его адрес отдаём в ConfigMap */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.postgres.headlessServiceName }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ include "postgres.port" . }}
      targetPort: postgresql
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.postgres.serviceName }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ include "postgres.port" . }}
      targetPort: postgresql
      protocol: TCP
{{- if .Values.nodePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-nodeport" .Values.global.postgres.serviceName }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ include "postgres.port" . }}
      targetPort: postgresql
      nodePort: {{ .Values.nodePort }}
      protocol: TCP
{{- end }}
