# Реестр осознанно принятых рисков для Trivy (ДЗ 10).
#
# Файл лежит в корне: Trivy подхватывает `.trivyignore.yaml` из рабочей директории
# сканирования, а сканируется весь репозиторий целиком.
#
# Правила игры:
#   * сюда попадает ТОЛЬКО то, что иначе валит гейт (`vuln` + CRITICAL + fixed);
#   * у каждой записи обязателен `statement` — почему риск принят;
#   * у каждой записи обязателен `expired_at` — после этой даты запись перестаёт
#     действовать и уязвимость снова валит пайплайн. Бессрочных исключений нет.
#
# HIGH-уязвимости и misconfig-находки здесь сознательно НЕ перечислены: они не
# участвуют в гейте и должны остаться видимыми в отчёте и в Security tab.

vulnerabilities:
  - id: CVE-2026-33815
    paths:
      - hw1-2/go.mod
    statement: >-
      github.com/jackc/pgx/v5 v5.5.5 -> 5.9.0. ДЗ 1-2 сдано и заморожено;
      подъём драйвера БД тянет за собой перепроверку миграций и это отдельная
      задача, а не правка из ДЗ про безопасность. Риск ограничен: сервис
      поднимается только в локальном minikube и наружу не публикуется.
    expired_at: 2027-01-01

  - id: CVE-2026-33816
    paths:
      - hw1-2/go.mod
    statement: >-
      Вторая CVE того же обновления github.com/jackc/pgx/v5 v5.5.5 -> 5.9.0.
      Причина отсрочки та же, что у CVE-2026-33815.
    expired_at: 2027-01-01

  - id: CVE-2026-56854
    paths:
      - hw1-2/go.mod
    statement: >-
      golang.org/x/crypto v0.17.0 -> 0.55.0, обход аутентификации в
      golang.org/x/crypto/ssh. В ДЗ 1-2 ssh-часть пакета не используется
      (зависимость транзитивная), поэтому вектор недостижим. Подъём
      golang.org/x/crypto закроет заодно 12 HIGH из отчёта и относится
      к ДЗ 1-2.
    expired_at: 2027-01-01
