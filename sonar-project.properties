# Конфигурация sonar-scanner (ДЗ 10).
#
# Файл ОБЯЗАН лежать в корне: sonar-scanner ищет sonar-project.properties в
# sonar.projectBaseDir, а анализируется весь репозиторий целиком - один проект
# k8s-hw на все ДЗ. Разносить ДЗ по отдельным Sonar-проектам смысла нет:
# история и метрики удобнее в одном месте.

sonar.projectKey=k8s-hw
sonar.projectName=Kubernetes homeworks
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.test.inclusions=**/*_test.go

# Генерируемое, вендоренное и бинарное: анализировать нечего, а шум большой.
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.min.js,\
  **/package-lock.json,\
  **/img/**,\
  **/*.png,\
  **/*.jpg,\
  **/*.svg,\
  hw1-2/docs/**,\
  hw1-2/helm/hw2_output.yaml

# Покрытие считает CI (джоба sonarqube) или scripts/04-sonar-scan-local.sh -
# сканер только читает уже готовые профили. Несуществующие пути Sonar
# молча пропускает, поэтому hw-8 указан заранее.
sonar.go.coverage.reportPaths=\
  hw1-2/coverage.out,\
  hw-3/go/coverage.out,\
  hw-4/coverage.out,\
  hw-7/coverage.out,\
  hw-8/coverage.out,\
  hw-9/coverage.out

sonar.python.version=3.12
