# Права для подов раннера: джоба deploy запускает внутри кластера
# `helm upgrade --install hw8-app ... -n k8s-hw8` и `kubectl rollout status`.
# Кластерных прав раннеру не даём — только namespace k8s-hw8.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hw8-runner-deployer
  namespace: arc-runners
  labels:
    app.kubernetes.io/part-of: hw8-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hw8-runner-deployer
  namespace: k8s-hw8
  labels:
    app.kubernetes.io/part-of: hw8-runner
rules:
  # secrets — не только для чарта: в них helm хранит состояние релиза.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
      - serviceaccounts
      - events
      - persistentvolumeclaims
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hw8-runner-deployer
  namespace: k8s-hw8
  labels:
    app.kubernetes.io/part-of: hw8-runner
subjects:
  - kind: ServiceAccount
    name: hw8-runner-deployer
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hw8-runner-deployer
---
# `helm upgrade --install --create-namespace` всегда делает POST на
# /api/v1/namespaces: ответ 409 AlreadyExists helm игнорирует, а 403 Forbidden —
# нет. Поэтому право create нужно даже когда namespace уже создан скриптом.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hw8-runner-namespace-bootstrap
  labels:
    app.kubernetes.io/part-of: hw8-runner
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hw8-runner-namespace-bootstrap
  labels:
    app.kubernetes.io/part-of: hw8-runner
subjects:
  - kind: ServiceAccount
    name: hw8-runner-deployer
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hw8-runner-namespace-bootstrap
