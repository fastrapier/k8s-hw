apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-news
  labels:
    app: consumer
    queue: news
spec:
  replicas: {{ .Values.consumer.replicas }}
  selector:
    matchLabels:
      app: consumer
      queue: news
  template:
    metadata:
      labels:
        app: consumer
        queue: news
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: consumer
          image: {{ .Values.werf.image.consumer }}
          args: ["--queue", "news", "--rmq-host", "$(RMQ_HOST)"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: vault-approle
