{{- if .Values.webui.enabled }}
# locust-k8s-operator создаёт для LocustTest только Service <name>-master
# с портами 5557/5558 (обмен master<->worker) и намеренно исключает 8089:
# в его коде есть отдельная проверка `if port == WebUIPort { continue }`.
# Поэтому Service load-test-v2-webui, которого требует задание, объявляем сами.
# Selector — тот же label, которым оператор помечает под мастера.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-webui" .Values.name }}
  labels: {{ include "locust.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    performance-test-pod-name: {{ include "locust.masterPodName" . }}
  ports:
    - name: webui
      port: {{ .Values.webui.port }}
      targetPort: {{ .Values.webui.port }}
      protocol: TCP
{{- end }}
