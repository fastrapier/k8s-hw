apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-locustfile
  labels: {{ include "locust.labels" . | nindent 4 }}
data:
  # Ключ становится именем файла в /lotest/src, поэтому он обязан совпадать
  # с --locustfile в командах мастера и воркера.
  locustfile.py: |
{{ .Files.Get "files/locustfile.py" | indent 4 }}
