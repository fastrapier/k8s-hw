port: 8080

# replicaCount управляет только первым разворачиванием: дальше число реплик
# принадлежит HPA, поэтому в шаблоне Deployment поле replicas опущено, когда
# autoscaling.enabled=true (иначе каждый helm upgrade сбрасывал бы масштаб).
replicaCount: 2

env:
  APP_CONFIG_MAP_ENV_VAR: hw7-load-testing
  APP_READINESS_WARMUP_SECONDS: "1"
  APP_SHUTDOWN_TIMEOUT_SECONDS: "10"
  APP_POSTGRES_MAX_CONNS: "10"
  # Число раундов SHA-256 в GET /db/report — «ручка» тяжести запроса.
  APP_REPORT_ROUNDS: "200"

secret:
  username: hw7-user
  password: hw7-app-password

ingress:
  enabled: true
  className: nginx
  host: api-hw7.local

# ЧАСТЬ 1 — начальные limits/requests.
# Сняты с профиля покоя (kubectl top: ~1-3m CPU, ~10-15Mi RAM на под)
# с запасом: requests чуть выше наблюдаемого покоя, limits ~5x.
# Значения из критической точки нагрузочного теста — в README.MD.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# ЧАСТЬ 3 — HPA.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      # Наверх реагируем сразу: очередь запросов растёт быстрее, чем поды.
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # Вниз — только после 5 минут спокойствия и по одному поду за минуту,
      # иначе HPA «пилит» реплики на всплесках трафика.
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

# ЧАСТЬ 3 — VPA применяет рекомендации по памяти. HPA управляет числом
# реплик по CPU; CPU requests VPA не меняет.
vpa:
  enabled: true
  updateMode: "Recreate"
  controlledResources: ["memory"]
  controlledValues: RequestsOnly
  minAllowed:
    memory: 32Mi
  maxAllowed:
    memory: 512Mi

migrations:
  enabled: true
  backoffLimit: 3

cron:
  enabled: true
  schedule: "*/5 * * * *"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
