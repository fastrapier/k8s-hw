{{- if .Values.cron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: api-cron
  labels: {{ include "backend.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {{ include "backend.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: cron
              image: {{ .Values.global.werf.images.cron.ref }}
              env: {{- include "backend.postgresEnv" . | nindent 16 }}
              resources: {{ toYaml .Values.cron.resources | nindent 16 }}
{{- end }}
