apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {{ include "backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{ include "backend.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: {{ include "backend.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Разносим реплики по нодам, если их больше одной: на minikube это no-op,
      # но HPA-масштабирование в один узел не упирается в жёсткое требование.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{ include "backend.selectorLabels" . | nindent 14 }}
      containers:
        - name: api
          image: {{ .Values.global.werf.images.app.ref }}
          env:
            - name: APP_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_SECRET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: username
            - name: APP_SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: password
            {{- include "backend.postgresEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: api-config
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # requests обязателен: без него HPA не может посчитать
          # averageUtilization, а VPA — сравнить рекомендацию с текущим запросом.
          resources: {{ toYaml .Values.resources | nindent 12 }}
