{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: api
  labels: {{ include "backend.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: api
        controlledResources: {{ toYaml .Values.vpa.controlledResources | nindent 10 }}
        # RequestsAndLimits ломает соотношение request/limit, выставленное в части 1:
        # VPA пересчитал бы limits пропорционально и «съел» бы запас на всплеск.
        controlledValues: {{ .Values.vpa.controlledValues }}
        minAllowed: {{ toYaml .Values.vpa.minAllowed | nindent 10 }}
        maxAllowed: {{ toYaml .Values.vpa.maxAllowed | nindent 10 }}
{{- end }}
