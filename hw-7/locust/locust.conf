# Настройки нагрузочного теста (часть 2 задания).
# Скрипты передают -f и --csv отдельно, здесь только параметры прогона.
# Любой параметр переопределяется переменной окружения LOCUST_<ИМЯ> или флагом CLI:
#   USERS=200 SPAWN_RATE=20 RUN_TIME=5m ./scripts/05-locust-local.sh

# URL приложения. По умолчанию — Ingress приложения (нужен minikube tunnel
# и запись в /etc/hosts); скрипт может подменить на port-forward.
host = http://api-hw7.local

# Максимум пользователей
users = 100

# Прирост пользователей в секунду
spawn-rate = 10

# Длительность теста
run-time = 3m

# Без web UI — прогон из командной строки
headless = true

# Итоговая сводка в stdout вместо непрерывного потока таблиц
only-summary = true

# Ненулевой exit code, если были ошибки или превышен порог времени ответа
exit-code-on-error = 1
