# Монолитный режим: один StatefulSet вместо read/write/backend — по ресурсам это
# единственный разумный вариант для minikube.
deploymentMode: SingleBinary

loki:
  # Мультиарендность не нужна: без неё не требуется заголовок X-Scope-OrgID
  # ни в promtail, ни в datasource Grafana.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Реплики распределённого режима: в SingleBinary они не нужны, но чарт всё равно
# создаст их с дефолтными значениями, если не обнулить явно.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# nginx-прокси перед Loki: даёт единый адрес loki-gateway:80 и для promtail,
# и для datasource Grafana.
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

# Кэши на memcached и S3-совместимое хранилище для filesystem-режима избыточны.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
