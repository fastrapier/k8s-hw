apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ingress-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingress-metrics.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # ServiceMonitor остаётся рядом с Prometheus, а на Service в чужом namespace
  # смотрит через namespaceSelector.
  namespaceSelector:
    matchNames:
      - {{ .Values.controller.namespace }}
  selector:
    matchLabels:
      {{- include "ingress-metrics.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
